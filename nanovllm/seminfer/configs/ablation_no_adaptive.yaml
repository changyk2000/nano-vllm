# SemInfer Configuration - Ablation: No Adaptive Sparsity
# Fixed sparsity for comparison with adaptive version

enabled: true

# Multi-layer Aggregation
aggregation_method: weighted
num_top_layers: 8

# Sliding Window Smoothing
use_smoothing: true
smoothing_kernel_size: 16
chunk_based_selection: true
chunk_size: 32

# Entropy-based Adaptive Sparsity - DISABLED
use_adaptive_sparsity: false  # Fixed sparsity
base_keep_percentage: 0.1

# Position Encoding
reconstruct_positions: true
position_reconstruction_method: contiguous

look_ahead_cnt: 8
