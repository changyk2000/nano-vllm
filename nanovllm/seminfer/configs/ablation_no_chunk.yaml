# SemInfer Configuration - Ablation: No Chunk Selection
# Per-token selection for comparison with chunk-based version

enabled: true

# Multi-layer Aggregation
aggregation_method: weighted
num_top_layers: 8

# Sliding Window Smoothing
use_smoothing: true
smoothing_kernel_size: 16
chunk_based_selection: false  # Per-token selection

# Entropy-based Adaptive Sparsity
use_adaptive_sparsity: true
base_keep_percentage: 0.1
min_keep_percentage: 0.05
max_keep_percentage: 0.3

# Position Encoding
reconstruct_positions: true
position_reconstruction_method: contiguous

look_ahead_cnt: 8
